---
#################################
# Prerequisites
#################################

- name: Install keycloak prerequisite applications
  block:
  - name: Install postgres and openjdk with apt
    ansible.builtin.apt:
      name:
       - postgresql
       - openjdk-21-jre
       - rsync
      state: present
      update_cache: true 
    when: ansible_facts['pkg_mgr'] == "apt"

  - name: Install postgres and openjdk with dnf
    ansible.builtin.dnf:
      name:
       - postgresql
       - postgresql-server
       - java-21-openjdk
       - rsync
      state: present
      update_cache: true
      use_backend: "dnf" 
    when: (ansible_facts['pkg_mgr'] is match("dnf*")) or (ansible_facts['pkg_mgr'] is match("yum*"))
  
  - name: Install postgres and openjdk with zypper
    ansible.builtin.zypper:
      name:
       - postgresql
       - postgresql-server
       - java-21-openjdk
       - rsync
      state: present
      update_cache: true 
    when: ansible_facts['pkg_mgr'] == "zypper"
  
  become: true


#################################
# Check if keycloak already deployed
#################################

- name: Check for existing keycloak install
  become: true
  ansible.builtin.stat:
    path: /opt/keycloak/bin/kc.sh
  register: keycloak_app_file

- block:
  - name: Report keycloak application files found
    ansible.builtin.debug:
      msg: "Keycloak already deployed. To update an existing installation run with the tag 'upgrade_keycloak'"
        
  - meta: end_host
  
  when: keycloak_app_file.stat.exists == true


#################################
# Download and unpack keycloak
#################################

- name: Get latest version tag if the version is not set in keycloak host_vars
  ansible.builtin.uri:
    url: https://api.github.com/repos/keycloak/keycloak/releases/latest
  register: keycloak_latest_tag
  when: keycloak_version == None or keycloak_version|length == 0

- name: Set keycloak_version var to latest version if not set
  ansible.builtin.set_fact:
    keycloak_version: "{{ keycloak_latest_tag.json.tag_name }}"
  when: keycloak_latest_tag is not skipped

- block:

  - name: Download keycloak
    ansible.builtin.get_url:
      dest: "/srv/keycloak/keycloak-{{ keycloak_version }}.tar.gz"
      url: "https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz"
      group: "{{ keycloak_install_backup_group }}"
      mode: '660'
    
  - name: Unpack keycloak
    ansible.builtin.unarchive:
      src: "/srv/keycloak/keycloak-{{ keycloak_version }}.tar.gz"
      remote_src: true
      dest: /srv/keycloak/
      creates: "/srv/keycloak/keycloak-{{ keycloak_version }}/bin/kc.sh" 
      #Ensures this is only performed on the first run
          
  - name: Copy application files to /opt/keycloak
    ansible.builtin.copy:
      src: "/srv/keycloak/keycloak-{{ keycloak_version }}/"
      remote_src: true
      dest: "/opt/keycloak/"

  - name: Give keycloak user ownership of /opt/keycloak
    ansible.builtin.file:
      path: /opt/keycloak
      recurse: true
      owner: keycloak
      group: keycloak

  - name: Clean up /srv/keycloak
    ansible.builtin.file:
      path: /srv/keycloak/keycloak-{{ keycloak_version }}
      state: absent
      
  - name: Clean up /srv/keycloak
    ansible.builtin.file:
      path: "/srv/keycloak/keycloak-{{ keycloak_version }}.tar.gz"
      state: absent
  
  become: true

