---
- name: Query mountpoints for the gitlab mount
  ansible.builtin.shell:
    cmd: "cat /proc/mounts | grep -q -s '/var/opt/gitlab'"
  register: mount_query
  ignore_errors: true
    
- name: Set as primary if gitlab mountpoint found
  ansible.builtin.set_fact:
    is_primary: "{{ mount_query.rc == 0 | default (false) }}"

