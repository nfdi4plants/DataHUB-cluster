---
- name: Update gitlab-secrets.json on the cluster host
  become: true
  vars:
    secrets_file: "{{ role_path }}/files/{{ gitlab_secrets }}"
  ansible.builtin.copy:
    src: "{{ gitlab_secrets }}"
    dest: /etc/gitlab/gitlab-secrets.json
    mode: '600'
    owner: root
  when: 
    - gitlab_secrets is defined
    - secrets_file is file
  register: gitlab_secrets
 
- name: Set a flag if secrets was updated
  ansible.builtin.set_fact:
    secrets_changed: "{{ gitlab_secrets is changed | default(False) }}"

